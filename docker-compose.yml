services:
  postgres:
    image: postgres:16-alpine
    container_name: fintrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintrace_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrace_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-fintrace_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintrace_user} -d ${POSTGRES_DB:-fintrace_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
